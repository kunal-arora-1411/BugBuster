name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose: pnpm/action-setup reads it from package.json's
      # "packageManager" field, and errors if both are set. One source of truth.
      - uses: pnpm/action-setup@v4

      # Node 22, not 20: the Agent compresses with Node's built-in zstd (node:zlib's
      # zstdCompressSync, added in Node 22.15) and the backend decompresses with it. On Node 20
      # those calls don't exist and the agent/backend tests fail with "zstdCompressSync is not a
      # function".
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test:unit

      # No external MongoDB service needed: mongodb-memory-server downloads and runs its own
      # real mongod binary per test file. Slower on a cold cache (first run downloads it), but
      # self-contained — the same command works identically on a contributor's machine.
      - run: pnpm test:integration
