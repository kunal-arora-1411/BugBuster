name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test:unit

      # No external MongoDB service needed: mongodb-memory-server downloads and runs its own
      # real mongod binary per test file. Slower on a cold cache (first run downloads it), but
      # self-contained — the same command works identically on a contributor's machine.
      - run: pnpm test:integration
