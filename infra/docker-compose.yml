services:
  mongo:
    image: mongo:7
    container_name: bugbuster-mongo
    ports:
      - "27017:27017"
    volumes:
      - bugbuster-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bugbuster-mongo-data:
